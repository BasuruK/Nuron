[project]
name = "nuron-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Basuru Balasuriya", email = "bestbasuru@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fsspec>=2026.7.0",
    "llama-cloud>=1.0",
    "llama-index-core==0.14.23",
    "llama-index-llms-openai-like==0.8.0",
    "openai>=2.54.0,<3",
    "psycopg[binary]>=3.3.5",
    "s3fs>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[[tool.mypy.overrides]]
# These libraries ship no py.typed marker; nothing to check against.
module = ["defusedxml.*", "fsspec.*", "llama_index.llms.openai_like.*"]
ignore_missing_imports = true


[tool.bandit.assert_used]
# Assert is the pytest idiom; suppress only B101 in test modules and scan everything else.
skips = ["*/*_test.py", "*/test_*.py"]
